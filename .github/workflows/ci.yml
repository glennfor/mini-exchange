name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: clang, preset: dev,     cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, compiler: clang, preset: release, cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, compiler: gcc,   preset: dev,     cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest, compiler: gcc,   preset: release, cc: gcc,   cxx: g++ }
          - { os: macos-latest,  compiler: clang, preset: dev,     cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          else
            brew install ninja
          fi
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build build/${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        env: { CC: clang, CXX: clang++ }
        run: cmake --preset asan
      - run: cmake --build build/asan
      - run: ctest --preset asan

  thread-sanitizer:
    name: tsan (ring + tap only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        env: { CC: clang, CXX: clang++ }
        run: cmake --preset tsan
      - run: cmake --build build/tsan
      # The concurrency label is empty until M1 lands the ring buffer; until
      # then this job exists to keep the preset honest.
      - run: ctest --preset tsan || true

  fuzz:
    name: libFuzzer -- ITCH decoder, 60s with ASan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        env: { CC: clang, CXX: clang++ }
        run: cmake --preset fuzz
      - run: cmake --build build/fuzz
      - name: Fuzz for 60 seconds from the committed seeds
        run: |
          ./build/fuzz/feed/fuzz/fuzz_itch \
            -max_total_time=60 -print_final_stats=1 \
            -artifact_prefix="$RUNNER_TEMP/" \
            feed/fuzz/corpus
      - name: Upload any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: ${{ runner.temp }}/{crash,leak,timeout}-*

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-format clang-tidy
      - name: clang-format check
        run: |
          files=$(git ls-files '*.hpp' '*.cpp' '*.h' '*.cc')
          [ -z "$files" ] || clang-format --dry-run --Werror $files
      - name: Configure for compile_commands.json
        env: { CC: clang, CXX: clang++ }
        run: cmake --preset dev
      - name: clang-tidy
        run: |
          files=$(git ls-files '*/include/*.hpp' '*/tests/*.cpp' '*/src/*.cpp' 'tools/*.cpp')
          [ -z "$files" ] || clang-tidy -p build/dev $files

  no-floats-in-hot-path:
    name: grep guard -- no float/double in core, book, engine, feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject floating point in the integer-price layers
        run: bash scripts/check_no_floats.sh

  python:
    name: ruff + pytest (pyref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ruff pytest
      - name: Lint
        run: ruff check pyref
      - name: Test (oracle alone, no C++ build present)
        run: pytest -q pyref

  differential:
    name: differential -- 1000 sequences x 1000 commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: pip install pytest
      - name: Build the engine
        env: { CC: clang, CXX: clang++ }
        run: cmake --preset release && cmake --build build/release --target engine_replay
      - name: Reference vs C++ engine (NaiveBook)
        run: |
          python -m pyref.differential \
            --engine build/release/tools/engine_replay --book naive \
            --seeds 1000 --length 1000 --out-dir "$RUNNER_TEMP/repro"
      - name: Reference vs C++ engine (FastBook)
        run: |
          python -m pyref.differential \
            --engine build/release/tools/engine_replay --book fast \
            --seeds 1000 --length 1000 --out-dir "$RUNNER_TEMP/repro"
      - name: Reference vs C++ engine, self-trade prevention on
        run: |
          python -m pyref.differential \
            --engine build/release/tools/engine_replay --stp \
            --seeds 200 --length 1000 --out-dir "$RUNNER_TEMP/repro"
      - name: Upload any minimised reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-reproducers
          path: ${{ runner.temp }}/repro

  book-differential:
    name: NaiveBook vs FastBook -- identical event streams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        env: { CC: clang, CXX: clang++ }
        run: cmake --preset release && cmake --build build/release --target engine_replay
      - name: Every flow pattern, both books, byte-identical
        run: |
          set -eux
          for pattern in balanced deep-book touch-churn wide-spread \
                         ladder-overflow pool-pressure; do
            for seed in 1 2 3; do
              ./build/release/tools/engine_replay \
                --synthetic 200000 --warmup 20000 --seed "$seed" \
                --pattern "$pattern" --book both --diff \
                --max-orders 1048576 --repro "$RUNNER_TEMP/repro.cmds"
            done
          done
      - name: Upload the divergent command stream if there was one
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: book-differential-repro
          path: ${{ runner.temp }}/repro.cmds

  determinism:
    name: determinism -- same input twice, and across -O levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build at -O3 and at -O0
        env: { CC: clang, CXX: clang++ }
        run: |
          cmake --preset release && cmake --build build/release --target engine_replay
          cmake --preset dev && cmake --build build/dev --target engine_replay
      - name: Record, replay, and compare across optimisation levels
        run: |
          set -eux
          ./build/release/tools/engine_replay --record run_a.events
          ./build/release/tools/engine_replay --record run_b.events
          cmp run_a.events run_b.events
          ./build/dev/tools/engine_replay --verify run_a.events
          ./build/release/tools/engine_replay --verify run_a.events
          # And the same stream from the other book, at both -O levels.
          ./build/release/tools/engine_replay --book fast --verify run_a.events
          ./build/dev/tools/engine_replay --book fast --verify run_a.events
